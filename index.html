<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D-workout | Warm Greige Workout Journal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            greige: {
              50: '#FAF9F7',   // 溫潤奶白卡片底色
              100: '#F5F2EE',  // 主畫布淡灰咖底色
              200: '#EBE5DD',  // 次要元素 / 框線
              300: '#DDD4C8',  // 懸停邊框 / 裝飾條
              400: '#C4B7A6',  // 柔和提示字
              500: '#A39482',  // 次要說明文字
              600: '#8E7F71',  // 品牌主色調（灰咖）
              700: '#6D6156',  // 深灰咖強調色
              800: '#423B33',  // 主標題與深色文字
              900: '#2E2923',
            }
          },
          boxShadow: {
            'soft': '0 10px 30px -10px rgba(66, 59, 51, 0.06)',
            'card': '0 2px 12px -2px rgba(66, 59, 51, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    /* 基礎細節與平滑滾動 */
    body {
      background-color: #F5F2EE;
      color: #423B33;
      -webkit-tap-highlight-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    /* 月曆平滑展開收合動畫 */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .accordion-content.open {
      grid-template-rows: 1fr;
    }
    .accordion-inner {
      overflow: hidden;
    }

    /* 分頁切換微淡入過渡 */
    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .page-transition {
      animation: pageFadeIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 抽屜滑出與遮罩過渡 */
    .drawer-backdrop-transition {
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .drawer-panel-transition {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 打氣小語文字淡入淡出 */
    .quote-fade {
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    /* 隱藏捲軸但保留滾動功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 細膩按壓回饋 */
    .btn-press {
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-press:active {
      transform: scale(0.975);
    }

    /* 隱藏數字輸入框預設上下箭頭 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-greige-300 selection:text-greige-900">

  <!-- 頂部輕量通知 Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[60] pointer-events-none opacity-0 -translate-y-3 transition-all duration-300">
    <div class="bg-greige-800 text-greige-50 px-4 py-2.5 rounded-full shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 tracking-wide max-w-[92vw]">
      <span id="toast-dot" class="w-2 h-2 rounded-full bg-[#C69C7B] shrink-0"></span>
      <span id="toast-msg" class="truncate">已儲存今日訓練</span>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="max-w-xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-20">
    
    <!-- ==========================================
         極簡頂部導覽切換 (D-workout)
         ========================================== -->
    <header class="flex items-center justify-between gap-3 mb-5">
      <div class="min-w-0">
        <p id="header-date-label" class="text-[11px] uppercase tracking-[0.16em] text-greige-500 font-medium mb-0.5 tabular-nums">
          WORKOUT JOURNAL
        </p>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-greige-800">
          D-workout
        </h1>
      </div>

      <!-- 高質感淡灰咖膠囊切換鈕：今日紀錄 | 紀錄與進步 -->
      <nav aria-label="主要頁面切換" class="inline-flex p-1 rounded-full bg-greige-200/85 border border-greige-300/70 shadow-xs shrink-0">
        <button type="button" id="nav-tab-home" onclick="switchMainPage('home')"
          class="btn-press px-3.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-all bg-greige-800 text-greige-50 shadow-xs">
          今日紀錄
        </button>
        <button type="button" id="nav-tab-analytics" onclick="switchMainPage('analytics')"
          class="btn-press px-3.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-all text-greige-600 hover:text-greige-800">
          紀錄與進步
        </button>
      </nav>
    </header>

    <!-- ==========================================
         第一頁：「今日紀錄」首頁（乾淨整潔、專注好紀錄）
         ========================================== -->
    <main id="page-home" class="page-transition space-y-4">
      
      <!-- 卡片一：本週日程與鎖定尺寸的目標進度列 -->
      <section class="bg-greige-50 rounded-3xl p-4 sm:p-5 border border-greige-200 shadow-soft">
        <div class="flex items-center justify-between gap-2 mb-3.5 px-0.5 min-h-[32px]">
          <div class="flex items-center gap-2 min-w-0">
            <h2 class="text-sm font-semibold text-greige-800 tracking-wide shrink-0">本週日程</h2>
            <span id="week-range-text" class="text-xs text-greige-500 tabular-nums truncate"></span>
          </div>

          <!-- 右側控制區：固定高度與不縮放寬度，徹底杜絕切換日期時跳動 -->
          <div class="flex items-center gap-2 shrink-0">
            <button type="button" id="btn-jump-today" onclick="selectToday()"
              class="btn-press h-7 text-[11px] text-greige-700 hover:text-greige-900 font-semibold px-2.5 rounded-full bg-greige-200/80 hover:bg-greige-300/80 transition-colors shrink-0 hidden">
              回到今天
            </button>

            <!-- 本週目標 X / 4 天 鎖定尺寸膠囊 -->
            <div class="h-8 inline-flex items-center gap-2 bg-greige-100 border border-greige-200/90 px-3 rounded-full shrink-0 select-none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="w-3.5 h-3.5 text-greige-600 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              <span class="text-[11px] text-greige-500 font-medium whitespace-nowrap">本週目標</span>
              <span class="text-xs font-bold text-greige-800 tabular-nums whitespace-nowrap"><span id="weekly-count">0</span> / 4 天</span>
              <div id="weekly-progress-bars" class="inline-flex items-center gap-1 ml-0.5 shrink-0" aria-label="本週運動進度">
                <span class="w-1.5 h-3.5 rounded-full bg-greige-200 shrink-0 transition-colors duration-300"></span>
                <span class="w-1.5 h-3.5 rounded-full bg-greige-200 shrink-0 transition-colors duration-300"></span>
                <span class="w-1.5 h-3.5 rounded-full bg-greige-200 shrink-0 transition-colors duration-300"></span>
                <span class="w-1.5 h-3.5 rounded-full bg-greige-200 shrink-0 transition-colors duration-300"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- 週一至週日橫向七日格子 -->
        <div id="weekly-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2">
          <!-- 由 JS 動態渲染 -->
        </div>
      </section>

      <!-- 卡片一點五：極簡訓練打氣小語（點擊可優雅切換下一句） -->
      <section class="bg-greige-50/90 rounded-2xl px-4 py-3 border border-greige-200/90 shadow-card flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-7 h-7 rounded-xl bg-greige-200/75 text-greige-700 flex items-center justify-center shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5 shrink-0">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
          </span>
          <p id="motivational-quote-text" class="quote-fade text-xs sm:text-[13px] text-greige-700 font-medium leading-relaxed truncate sm:whitespace-normal">
            每一次推起，都在雕刻更強大的自己。
          </p>
        </div>
        <button type="button" onclick="cycleMotivationalQuote()" aria-label="換一句打氣小語" title="換一句打氣小語"
          class="btn-press w-7 h-7 rounded-xl bg-greige-100 hover:bg-greige-200/80 text-greige-500 hover:text-greige-800 flex items-center justify-center shrink-0 transition-colors">
          <svg id="quote-refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5 transition-transform duration-300 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
      </section>

      <!-- 卡片二：部位快速紀錄按鈕（推 / 拉 / 腿 / 核心） -->
      <section class="bg-greige-50 rounded-3xl p-5 sm:p-6 border border-greige-200 shadow-soft">
        <div class="flex items-center justify-between mb-4">
          <div>
            <span id="selected-day-badge" class="inline-block text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-greige-200 text-greige-700 mb-1">
              今天
            </span>
            <h2 id="selected-date-title" class="text-lg font-semibold text-greige-800">
              選擇訓練部位
            </h2>
          </div>

          <button type="button" id="btn-clear-day" onclick="clearSelectedDay()"
            class="text-xs text-greige-400 hover:text-red-700 px-2.5 py-1.5 rounded-xl hover:bg-greige-100 transition-colors hidden">
            清除當日
          </button>
        </div>

        <!-- 四大訓練部位按鈕網格：點擊開啟動作與重量明細抽屜 -->
        <div class="grid grid-cols-2 gap-3 sm:gap-3.5 mb-4">
          
          <!-- 推 PUSH -->
          <button type="button" id="btn-type-push" onclick="openWorkoutDrawer('push')"
            class="workout-btn btn-press group relative flex flex-col items-start justify-between p-4 sm:p-5 rounded-2xl border border-greige-200 bg-greige-100/70 hover:bg-greige-100 hover:border-greige-300 text-left">
            <div class="w-full flex items-center justify-between mb-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-[#C69C7B]"></span>
              <span class="status-pill text-[11px] font-medium px-2 py-0.5 rounded-full bg-greige-200/80 text-greige-600 transition-colors">
                點此紀錄
              </span>
            </div>
            <div>
              <div class="flex items-baseline gap-2">
                <span class="text-xl sm:text-2xl font-bold text-greige-800 tracking-tight">推</span>
                <span class="text-[11px] font-semibold tracking-widest text-greige-400">PUSH</span>
              </div>
              <p class="type-subtext text-xs text-greige-500 mt-1 line-clamp-1">胸 / 肩 / 三頭</p>
            </div>
          </button>

          <!-- 拉 PULL -->
          <button type="button" id="btn-type-pull" onclick="openWorkoutDrawer('pull')"
            class="workout-btn btn-press group relative flex flex-col items-start justify-between p-4 sm:p-5 rounded-2xl border border-greige-200 bg-greige-100/70 hover:bg-greige-100 hover:border-greige-300 text-left">
            <div class="w-full flex items-center justify-between mb-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-[#8B9A8C]"></span>
              <span class="status-pill text-[11px] font-medium px-2 py-0.5 rounded-full bg-greige-200/80 text-greige-600 transition-colors">
                點此紀錄
              </span>
            </div>
            <div>
              <div class="flex items-baseline gap-2">
                <span class="text-xl sm:text-2xl font-bold text-greige-800 tracking-tight">拉</span>
                <span class="text-[11px] font-semibold tracking-widest text-greige-400">PULL</span>
              </div>
              <p class="type-subtext text-xs text-greige-500 mt-1 line-clamp-1">背 / 二頭 / 後三角</p>
            </div>
          </button>

          <!-- 腿 LEGS -->
          <button type="button" id="btn-type-legs" onclick="openWorkoutDrawer('legs')"
            class="workout-btn btn-press group relative flex flex-col items-start justify-between p-4 sm:p-5 rounded-2xl border border-greige-200 bg-greige-100/70 hover:bg-greige-100 hover:border-greige-300 text-left">
            <div class="w-full flex items-center justify-between mb-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-[#9E8576]"></span>
              <span class="status-pill text-[11px] font-medium px-2 py-0.5 rounded-full bg-greige-200/80 text-greige-600 transition-colors">
                點此紀錄
              </span>
            </div>
            <div>
              <div class="flex items-baseline gap-2">
                <span class="text-xl sm:text-2xl font-bold text-greige-800 tracking-tight">腿</span>
                <span class="text-[11px] font-semibold tracking-widest text-greige-400">LEGS</span>
              </div>
              <p class="type-subtext text-xs text-greige-500 mt-1 line-clamp-1">股四頭 / 腿後 / 臀</p>
            </div>
          </button>

          <!-- 核心 CORE -->
          <button type="button" id="btn-type-core" onclick="openWorkoutDrawer('core')"
            class="workout-btn btn-press group relative flex flex-col items-start justify-between p-4 sm:p-5 rounded-2xl border border-greige-200 bg-greige-100/70 hover:bg-greige-100 hover:border-greige-300 text-left">
            <div class="w-full flex items-center justify-between mb-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-[#B5A384]"></span>
              <span class="status-pill text-[11px] font-medium px-2 py-0.5 rounded-full bg-greige-200/80 text-greige-600 transition-colors">
                點此紀錄
              </span>
            </div>
            <div>
              <div class="flex items-baseline gap-2">
                <span class="text-xl sm:text-2xl font-bold text-greige-800 tracking-tight">核心</span>
                <span class="text-[11px] font-semibold tracking-widest text-greige-400">CORE</span>
              </div>
              <p class="type-subtext text-xs text-greige-500 mt-1 line-clamp-1">腹直肌 / 穩定肌群</p>
            </div>
          </button>

        </div>

        <!-- 當日已紀錄動作精簡摘要（有資料時才顯示，保持首頁乾淨） -->
        <div id="day-exercises-summary" class="hidden mb-4 pt-3.5 border-t border-greige-200/70">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-semibold tracking-wide text-greige-500">當日已紀錄明細</span>
            <button type="button" onclick="switchMainPage('analytics')"
              class="text-[11px] text-greige-600 hover:text-greige-900 font-medium underline underline-offset-2">
              查看歷史與進步 →
            </button>
          </div>
          <div id="day-exercises-chips" class="flex flex-wrap gap-1.5">
            <!-- 精簡膠囊標籤 -->
          </div>
        </div>

        <!-- 極簡當日隨手筆記 -->
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-greige-400 absolute left-3.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"></path>
          </svg>
          <input id="workout-note-input" type="text" maxlength="80"
            placeholder="新增當日備註（例：狀態極佳、體重 68kg...）"
            class="w-full bg-greige-100/80 border border-greige-200 rounded-2xl pl-10 pr-16 py-2.5 text-xs sm:text-sm text-greige-800 placeholder-greige-400 focus:outline-none focus:border-greige-600 focus:bg-greige-50 transition-colors" />
          <button type="button" onclick="saveNote()"
            class="btn-press absolute right-1.5 text-xs font-medium px-3 py-1.5 rounded-xl bg-greige-200/80 hover:bg-greige-300/80 text-greige-700 transition-colors">
            儲存
          </button>
        </div>
      </section>

      <!-- 卡片三：可拉開一整個月的「本月運動狀況」折疊卡片 -->
      <section class="bg-greige-50 rounded-3xl border border-greige-200 shadow-soft overflow-hidden">
        <button type="button" id="btn-toggle-month" onclick="toggleMonthAccordion()"
          class="w-full px-5 py-4 flex items-center justify-between text-left hover:bg-greige-100/50 transition-colors">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-2xl bg-greige-200/80 flex items-center justify-center text-greige-700 shrink-0">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"></path>
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-sm sm:text-base font-semibold text-greige-800">本月運動狀況</h2>
                <span id="month-summary-badge" class="text-xs font-medium px-2 py-0.5 rounded-full bg-greige-200 text-greige-700 tabular-nums">
                  累積 0 天
                </span>
              </div>
              <p id="month-toggle-hint" class="text-xs text-greige-500 mt-0.5">點擊拉開檢視整月日曆</p>
            </div>
          </div>

          <div class="w-8 h-8 rounded-full bg-greige-100 border border-greige-200 flex items-center justify-center text-greige-600 shrink-0">
            <svg id="month-chevron" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
            </svg>
          </div>
        </button>

        <!-- 可展開的整月日曆內容 -->
        <div id="month-accordion" class="accordion-content">
          <div class="accordion-inner">
            <div class="px-5 pb-6 pt-2 border-t border-greige-200/70">
              
              <!-- 月份切換列 -->
              <div class="flex items-center justify-between my-3">
                <button type="button" onclick="changeCalendarMonth(-1)" aria-label="上個月"
                  class="btn-press p-2 rounded-xl hover:bg-greige-200/70 text-greige-600 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"></path>
                  </svg>
                </button>
                <span id="calendar-month-title" class="text-sm font-semibold text-greige-800 tracking-wide">
                  2026年 11月
                </span>
                <button type="button" onclick="changeCalendarMonth(1)" aria-label="下個月"
                  class="btn-press p-2 rounded-xl hover:bg-greige-200/70 text-greige-600 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path>
                  </svg>
                </button>
              </div>

              <!-- 星期表頭 -->
              <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <span class="text-[11px] font-medium text-greige-400">一</span>
                <span class="text-[11px] font-medium text-greige-400">二</span>

  <!-- 核心 JavaScript 邏輯 -->
  <script>
    const STORAGE_KEY = 'd_workout_greige_data_v2';
    const WEEK_DAYS_SHORT = ['一', '二', '三', '四', '五', '六', '日'];
    const TYPE_ORDER = ['push', 'pull', 'legs', 'core'];

    const WORKOUT_TYPES = {
      push: {

      },

        label: '腿',
        en: 'LEGS',
        desc: '股四頭 / 腿後 / 臀',
        dotColor: '#9E8576',
        borderActive: 'border-[#9E8576]',
        badgeBg: 'bg-[#9E8576]/20',
        badgeText: 'text-[#6E5445]',
        presets: ['槓鈴深蹲', '腿推機 Leg Press', '羅馬尼亞硬舉', '保加利亞分腿蹲', '坐姿腿屈伸', '俯臥腿後勾']
      },
      core: {
        id: 'core',
        label: '核心',
        en: 'CORE',
        desc: '腹直肌 / 穩定肌群',
        dotColor: '#B5A384',
        borderActive: 'border-[#B5A384]',
        badgeBg: 'bg-[#B5A384]/25',
        badgeText: 'text-[#756448]',
        presets: ['棒式支撐', '懸垂舉腿', '繩索捲腹', '俄羅斯轉體', '死蟲式', '健腹輪']
      }
    };

    const MOTIVATIONAL_QUOTES = [
      '每一次推起，都在雕刻更強大的自己。',
      '不需要完美才開始，開始了才會越來越強。',
      '一週四天的穩定累積，終將成為你最強的底氣。',
      '專注當下的每一次呼吸與發力，汗水不會辜負你。',
      '今天的每一步堅持，都在為未來的自己鋪路。',
      '哪怕只比上次多 2.5kg 或多一下，都是實實在在的進步。'
    ];

    // 狀態管理變數
    let workoutData = {};
    const todayDate = new Date();
    const todayStr = formatDateKey(todayDate);
    let selectedDateStr = todayStr;
    let calendarYear = todayDate.getFullYear();
    let calendarMonth = todayDate.getMonth();
    let isMonthExpanded = false;

    let currentMainPage = 'home';
    let activeAnalyticsSubTab = 'progress';
    let historyFilter = 'all';

    let activeDrawerType = null;
    let draftExercises = [];
    let currentQuoteIndex = 0;
    let toastTimer = null;

    /* ============================================================
       日期與基礎工具函式
       ============================================================ */

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getWeekDates(baseDate) {
      const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
      const day = d.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMonday);

      const week = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + i);
        week.push(cur);
      }
      return week;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          workoutData = JSON.parse(raw) || {};
        }
      } catch (err) {
        console.error('讀取儲存資料失敗:', err);
        workoutData = {};
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(workoutData));
      } catch (err) {
        console.error('寫入儲存資料失敗:', err);
      }
    }

    function showToast(message, dotColor = '#C69C7B') {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      const dotEl = document.getElementById('toast-dot');
      if (!toast || !msgEl || !dotEl) return;

      msgEl.textContent = message;
      dotEl.style.backgroundColor = dotColor;

      toast.classList.remove('opacity-0', '-translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-3');
      }, 2400);
    }

    /* ============================================================
       應用程式初始化 (init)
       ============================================================ */

    function init() {
      loadFromStorage();

      // 若首次使用且無任何紀錄，自動載入示範數據讓畫面與圖表完整呈現
      if (Object.keys(workoutData).length === 0) {
        loadSampleData(false);
      }

      // 隨機挑選一則今日打氣小語
      currentQuoteIndex = Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length);
      const quoteEl = document.getElementById('motivational-quote-text');
      if (quoteEl) {
        quoteEl.textContent = MOTIVATIONAL_QUOTES[currentQuoteIndex];
      }

      renderAll();
    }

    /* ============================================================
       主頁面導覽與打氣小語切換
       ============================================================ */

    function switchMainPage(page) {
      currentMainPage = page;
      const homePage = document.getElementById('page-home');
      const analyticsPage = document.getElementById('page-analytics');
      const tabHome = document.getElementById('nav-tab-home');
      const tabAnalytics = document.getElementById('nav-tab-analytics');

      if (page === 'home') {
        homePage.classList.remove('hidden');
        homePage.classList.remove('page-transition');
        void homePage.offsetWidth;
        homePage.classList.add('page-transition');

        analyticsPage.classList.add('hidden');
        tabHome.className = 'btn-press px-3.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-all bg-greige-800 text-greige-50 shadow-xs';
        tabAnalytics.className = 'btn-press px-3.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-all text-greige-600 hover:text-greige-800';
        renderHomeViews();
      } else {
        homePage.classList.add('hidden');
        analyticsPage.classList.remove('hidden');
        analyticsPage.classList.remove('page-transition');
        void analyticsPage.offsetWidth;
        analyticsPage.classList.add('page-transition');

        tabAnalytics.className = 'btn-press px-3.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-all bg-greige-800 text-greige-50 shadow-xs';
        tabHome.className = 'btn-press px-3.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-all text-greige-600 hover:text-greige-800';
        renderAnalyticsPage();
      }
    }

    function cycleMotivationalQuote() {
      const quoteEl = document.getElementById('motivational-quote-text');
      const iconEl = document.getElementById('quote-refresh-icon');
      if (!quoteEl) return;

      currentQuoteIndex = (currentQuoteIndex + 1) % MOTIVATIONAL_QUOTES.length;
      quoteEl.style.opacity = '0';
      quoteEl.style.transform = 'translateY(3px)';
      if (iconEl) {
        iconEl.style.transform = 'rotate(180deg)';
      }

      setTimeout(() => {
        quoteEl.textContent = MOTIVATIONAL_QUOTES[currentQuoteIndex];
        quoteEl.style.opacity = '1';
        quoteEl.style.transform = 'translateY(0)';
        if (iconEl) {
          iconEl.style.transform = 'rotate(0deg)';
        }
      }, 160);
    }

    /* ============================================================
       訓練明細抽屜控制 (開啟 / 關閉 / 常用動作點選)
       ============================================================ */

    function openWorkoutDrawer(typeId) {
      const meta = WORKOUT_TYPES[typeId];
      if (!meta) return;

      activeDrawerType = typeId;
      const existingRecord = workoutData[selectedDateStr] || { types: [], details: {}, note: '' };
      const existingExercises = (existingRecord.details && existingRecord.details[typeId]) || [];

      // 深拷貝現有動作至草稿
      draftExercises = existingExercises.map(ex => ({ ...ex }));

      const selDate = parseDateKey(selectedDateStr);
      const weekLabel = WEEK_DAYS_SHORT[selDate.getDay() === 0 ? 6 : selDate.getDay() - 1];

      document.getElementById('drawer-type-dot').style.backgroundColor = meta.dotColor;
      document.getElementById('drawer-title').textContent = `${meta.label} (${meta.en}) · 訓練明細`;
      document.getElementById('drawer-subtitle').textContent =
        `${selDate.getFullYear()}年${selDate.getMonth() + 1}月${selDate.getDate()}日 (週${weekLabel}) · 預設 3 組`;

      const deleteBtn = document.getElementById('btn-drawer-delete-type');
      if (existingRecord.types && existingRecord.types.includes(typeId)) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }

      document.getElementById('custom-exercise-input').value = '';
      renderDrawerPresets();
      renderDrawerExercises();

      const backdrop = document.getElementById('workout-drawer-backdrop');
      const panel = document.getElementById('workout-drawer-panel');
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        panel.classList.remove('translate-y-6', 'opacity-0');
        panel.classList.add('translate-y-0', 'opacity-100');
      });
    }

    function closeWorkoutDrawer() {
      const backdrop = document.getElementById('workout-drawer-backdrop');
      const panel = document.getElementById('workout-drawer-panel');
      panel.classList.remove('translate-y-0', 'opacity-100');
      panel.classList.add('translate-y-6', 'opacity-0');

      setTimeout(() => {
        backdrop.classList.add('hidden');
        activeDrawerType = null;
        draftExercises = [];
      }, 220);
    }

    function renderDrawerPresets() {
      const wrap = document.getElementById('preset-exercises-wrap');
      wrap.innerHTML = '';
      if (!activeDrawerType) return;

      const presets = WORKOUT_TYPES[activeDrawerType].presets || [];
      presets.forEach(name => {
        const isSelected = draftExercises.some(ex => ex.name === name);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => togglePresetExercise(name);

        if (isSelected) {
          btn.className = 'btn-press px-3 py-1.5 rounded-full text-xs font-semibold bg-greige-800 text-greige-50 shadow-xs transition-all';
          btn.textContent = `✓ ${name}`;
        } else {
          btn.className = 'btn-press px-3 py-1.5 rounded-full text-xs font-medium bg-greige-100 hover:bg-greige-200/80 text-greige-700 border border-greige-200 transition-all';
          btn.textContent = `+ ${name}`;
        }
        wrap.appendChild(btn);
      });
    }

    function togglePresetExercise(name) {
      const idx = draftExercises.findIndex(ex => ex.name === name);
      if (idx !== -1) {
        draftExercises.splice(idx, 1);
      } else {
        addExerciseToDraft(name);
      }
      renderDrawerPresets();
      renderDrawerExercises();
    }

    function addCustomExerciseFromInput() {
      const input = document.getElementById('custom-exercise-input');
      const name = input.value.trim();
      if (!name) return;

      if (!draftExercises.some(ex => ex.name === name)) {
        addExerciseToDraft(name);
      }
      input.value = '';
      renderDrawerPresets();
      renderDrawerExercises();
    }

    /**
     * 將動作加入草稿列表（極簡模式：只需記錄重量與次數，預設以 3 組為基準）
     */
    function addExerciseToDraft(name) {
      const lastRecord = findLastExerciseRecord(name, selectedDateStr);
      let initialWeight = '';
      let initialReps = 10;

      if (lastRecord) {
        if (typeof lastRecord.weight === 'number' && lastRecord.weight > 0) {
          initialWeight = lastRecord.weight;
          initialReps = lastRecord.reps || 10;
        } else if (lastRecord.sets && lastRecord.sets.length > 0) {
          // 兼容舊版多組格式，取最大重量與對應次數
          const bestSet = lastRecord.sets.reduce((best, cur) =>
            (Number(cur.weight) || 0) >= (Number(best.weight) || 0) ? cur : best
          , lastRecord.sets[0]);
          initialWeight = Number(bestSet.weight) || '';
          initialReps = Number(bestSet.reps) || 10;
        }
      }

      draftExercises.push({
        name: name,
        weight: initialWeight,
        reps: initialReps
      });
    }

    /**
     * 移除草稿中的單一動作
     */
    function removeDraftExercise(exIdx) {
      draftExercises.splice(exIdx, 1);
      renderDrawerPresets();
      renderDrawerExercises();
    }

    /**
     * 快速加減重量（-2.5 / +2.5 按鈕）
     */
    function adjustDraftWeight(exIdx, delta) {
      const ex = draftExercises[exIdx];
      if (!ex) return;
      const current = parseFloat(ex.weight) || 0;
      const next = Math.max(0, Number((current + delta).toFixed(1)));
      ex.weight = next;
      renderDrawerExercises();
    }

    /**
     * 快速加減次數（-1 / +1 按鈕）
     */
    function adjustDraftReps(exIdx, delta) {
      const ex = draftExercises[exIdx];
      if (!ex) return;
      const current = parseInt(ex.reps, 10) || 0;
      const next = Math.max(1, current + delta);
      ex.reps = next;
      renderDrawerExercises();
    }

    /**
     * 更新草稿中某動作的重量或次數
     */
    function updateDraftField(exIdx, field, rawVal) {
      const ex = draftExercises[exIdx];
      if (!ex) return;
      ex[field] = rawVal === '' ? '' : Number(rawVal);
    }

    /**
     * 渲染抽屜內已選擇的動作卡片（極簡單列：僅需填寫重量與次數，預設 3 組）
     */
    function renderDrawerExercises() {
      const container = document.getElementById('drawer-exercises-list');
      container.innerHTML = '';

      if (draftExercises.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl border border-dashed border-greige-300 bg-greige-100/60 p-6 text-center">
            <p class="text-xs sm:text-sm text-greige-600 font-medium">尚未加入訓練動作</p>
            <p class="text-[11px] text-greige-400 mt-1">點選上方常用動作即可快速記錄重量與次數（預設 3 組）</p>
          </div>
        `;
        return;
      }

      draftExercises.forEach((ex, exIdx) => {
        // 兼容舊資料結構，確保取得 weight 與 reps
        let curWeight = ex.weight !== undefined ? ex.weight : '';
        let curReps = ex.reps !== undefined ? ex.reps : 10;
        if (ex.weight === undefined && ex.sets && ex.sets.length > 0) {
          const bestSet = ex.sets.reduce((best, cur) =>
            (Number(cur.weight) || 0) >= (Number(best.weight) || 0) ? cur : best
          , ex.sets[0]);
          curWeight = bestSet.weight !== '' ? bestSet.weight : '';
          curReps = bestSet.reps !== '' ? bestSet.reps : 10;
          ex.weight = curWeight;
          ex.reps = curReps;
        }

        const card = document.createElement('div');
        card.className = 'rounded-2xl bg-greige-100/85 border border-greige-200 p-3.5 sm:p-4 transition-all';

        const lastRecord = findLastExerciseRecord(ex.name, selectedDateStr);
        let lastHintHtml = '';
        if (lastRecord) {
          const lastW = lastRecord.weight !== undefined
            ? lastRecord.weight
            : (lastRecord.sets?.length ? Math.max(...lastRecord.sets.map(s => Number(s.weight) || 0)) : 0);
          const lastR = lastRecord.reps !== undefined
            ? lastRecord.reps
            : (lastRecord.sets?.length ? lastRecord.sets[0].reps : 10);

          if (lastW > 0 || lastR > 0) {
            lastHintHtml = `
              <span class="text-[11px] text-greige-500 tabular-nums">
                上次 ${lastRecord.dateStr.slice(5).replace('-', '/')}：<strong class="text-greige-700 font-semibold">${lastW}kg × ${lastR}下</strong>
              </span>
            `;
          }
        }

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <div class="flex items-center gap-2 min-w-0 flex-wrap">
              <span class="w-1.5 h-4 rounded-full bg-greige-600 shrink-0"></span>
              <h4 class="text-sm font-semibold text-greige-800 truncate">${escapeHtml(ex.name)}</h4>
              ${lastHintHtml}
            </div>
            <button type="button" onclick="removeDraftExercise(${exIdx})"
              class="text-[11px] text-greige-400 hover:text-red-700 transition-colors px-1.5 py-0.5 shrink-0">
              移除
            </button>
          </div>

          <!-- 極簡一行式輸入：重量 (kg) + 次數 (下) -->
          <div class="flex items-center gap-2">
            <!-- 重量快速加減 + 輸入框 -->
            <div class="flex items-center bg-greige-50 border border-greige-200 rounded-xl overflow-hidden flex-1">
              <button type="button" onclick="adjustDraftWeight(${exIdx}, -2.5)"
                class="btn-press px-2.5 py-2 text-xs font-semibold text-greige-500 hover:text-greige-800 hover:bg-greige-200/60 transition-colors shrink-0"
                title="減少 2.5kg">
                -2.5
              </button>
              <div class="relative flex-1 min-w-0">
                <input type="number" step="0.5" min="0" placeholder="0"
                  value="${curWeight !== '' ? curWeight : ''}"
                  oninput="updateDraftField(${exIdx}, 'weight', this.value)"
                  class="w-full bg-transparent py-2 pr-5 text-sm font-bold text-greige-800 text-center tabular-nums focus:outline-none" />
                <span class="text-[11px] text-greige-400 absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none">kg</span>
              </div>
              <button type="button" onclick="adjustDraftWeight(${exIdx}, 2.5)"
                class="btn-press px-2.5 py-2 text-xs font-semibold text-greige-500 hover:text-greige-800 hover:bg-greige-200/60 transition-colors shrink-0"
                title="增加 2.5kg">
                +2.5
              </button>
            </div>

            <!-- 次數快速加減 + 輸入框 -->
            <div class="flex items-center bg-greige-50 border border-greige-200 rounded-xl overflow-hidden w-[124px] shrink-0">
              <button type="button" onclick="adjustDraftReps(${exIdx}, -1)"
                class="btn-press px-2 py-2 text-xs font-semibold text-greige-500 hover:text-greige-800 hover:bg-greige-200/60 transition-colors shrink-0"
                title="減少 1 下">
                -1
              </button>
              <div class="relative flex-1 min-w-0">
                <input type="number" step="1" min="0" placeholder="10"
                  value="${curReps !== '' ? curReps : ''}"
                  oninput="updateDraftField(${exIdx}, 'reps', this.value)"
                  class="w-full bg-transparent py-2 pr-4 text-sm font-bold text-greige-800 text-center tabular-nums focus:outline-none" />
                <span class="text-[11px] text-greige-400 absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none">下</span>
              </div>
              <button type="button" onclick="adjustDraftReps(${exIdx}, 1)"
                class="btn-press px-2 py-2 text-xs font-semibold text-greige-500 hover:text-greige-800 hover:bg-greige-200/60 transition-colors shrink-0"
                title="增加 1 下">
                +1
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    /**
     * 儲存抽屜中的運動明細與部位打卡（精簡格式：僅存重量與次數，預設 3 組）
     */
    function saveWorkoutDrawer() {
      if (!activeDrawerType) return;
      const typeId = activeDrawerType;
      const existing = workoutData[selectedDateStr] || { types: [], details: {}, note: '' };
      if (!existing.details) existing.details = {};

      if (!existing.types.includes(typeId)) {
        existing.types.push(typeId);
        existing.types.sort((a, b) => TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b));
      }

      const cleanedExercises = draftExercises
        .filter(ex => ex.name && ex.name.trim() !== '')
        .map(ex => ({
          name: ex.name.trim(),
          weight: ex.weight === '' || ex.weight === undefined ? 0 : Number(ex.weight),
          reps: ex.reps === '' || ex.reps === undefined ? 0 : Number(ex.reps)
        }));

      existing.details[typeId] = cleanedExercises;
      workoutData[selectedDateStr] = existing;

      saveToStorage();
      closeWorkoutDrawer();
      renderAll();
      showToast(`已儲存「${WORKOUT_TYPES[typeId].label}」紀錄，繼續保持節奏！`, WORKOUT_TYPES[typeId].dotColor);
    }

    /**
     * 刪除目前抽屜開啟部位的當日紀錄
     */
    function removeWorkoutTypeFromDay() {
      if (!activeDrawerType) return;
      const typeId = activeDrawerType;
      const existing = workoutData[selectedDateStr];
      if (existing) {
        existing.types = existing.types.filter(t => t !== typeId);
        if (existing.details) {
          delete existing.details[typeId];
        }
        if (existing.types.length === 0 && !existing.note) {
          delete workoutData[selectedDateStr];
        }
        saveToStorage();
      }
      closeWorkoutDrawer();
      renderAll();
      showToast(`已取消「${WORKOUT_TYPES[typeId].label}」紀錄`, '#A39482');
    }

    /**
     * 儲存當日隨手筆記
     */
    function saveNote() {
      const noteInput = document.getElementById('workout-note-input');
      const noteText = noteInput.value.trim();
      const existing = workoutData[selectedDateStr] || { types: [], details: {}, note: '' };

      if (!noteText && existing.types.length === 0) {
        delete workoutData[selectedDateStr];
      } else {
        existing.note = noteText;
        workoutData[selectedDateStr] = existing;
      }

      saveToStorage();
      renderAll();
      showToast('已更新當日備註', '#8E7F71');
    }

    /**
     * 清除選定日期的所有紀錄
     */
    function clearSelectedDay() {
      if (workoutData[selectedDateStr]) {
        delete workoutData[selectedDateStr];
        saveToStorage();
        renderAll();
        showToast('已清除當日紀錄', '#A39482');
      }
    }

    /**
     * 選擇某一天並同步月份檢視
     */
    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      const d = parseDateKey(dateStr);
      calendarYear = d.getFullYear();
      calendarMonth = d.getMonth();
      renderAll();

    /**
     * 展開 / 收合「本月運動狀況」月曆
     */
    function toggleMonthAccordion() {
      isMonthExpanded = !isMonthExpanded;
      const accordion = document.getElementById('month-accordion');
      const chevron = document.getElementById('month-chevron');
      const hint = document.getElementById('month-toggle-hint');

      if (isMonthExpanded) {

        chevron.style.transform = 'rotate(180deg)';

      }
    }

    /**
     * 切換月曆月份
     */
    function changeCalendarMonth(delta) {
      calendarMonth += delta;
      if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear += 1;
      } else if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear -= 1;
      }
      renderMonthCalendar();
    }

    /* ============================================================
       歷史搜尋與重量進步分析輔助邏輯（兼容精簡單組與舊版多組格式）
       ============================================================ */

    function extractExerciseMetrics(ex) {
      if (ex.weight !== undefined) {
        const w = Number(ex.weight) || 0;
        const r = Number(ex.reps) || 0;
        return {
          weight: w,
          reps: r,
          totalVolume: w * r * 3 // 固定以 3 組起跳估算總訓練量
        };
      }
      const validSets = (ex.sets || []).filter(s => Number(s.weight) > 0 || Number(s.reps) > 0);
      if (validSets.length === 0) return { weight: 0, reps: 0, totalVolume: 0 };
      const bestSet = validSets.reduce((best, cur) =>
        (Number(cur.weight) || 0) >= (Number(best.weight) || 0) ? cur : best
      , validSets[0]);
      const totalVolume = validSets.reduce((acc, s) => acc + (Number(s.weight) || 0) * (Number(s.reps) || 0), 0);
      return {
        weight: Number(bestSet.weight) || 0,
        reps: Number(bestSet.reps) || 0,
        totalVolume
      };
    }

    function findLastExerciseRecord(exerciseName, beforeDateStr) {
      const sortedDates = Object.keys(workoutData).sort((a, b) => b.localeCompare(a));
      for (const dateStr of sortedDates) {
        if (beforeDateStr && dateStr >= beforeDateStr) continue;
        const entry = workoutData[dateStr];
        if (!entry || !entry.details) continue;
        for (const typeId of Object.keys(entry.details)) {
          const list = entry.details[typeId] || [];
          const found = list.find(e => e.name === exerciseName);
          if (found) {
            const metrics = extractExerciseMetrics(found);
            if (metrics.weight > 0 || metrics.reps > 0) {
              return { dateStr, weight: metrics.weight, reps: metrics.reps, sets: found.sets };
            }
          }
        }
      }
      return null;
    }

    function getAllRecordedExercises() {
      const exerciseMap = new Map();
      const sortedDates = Object.keys(workoutData).sort((a, b) => a.localeCompare(b));

      sortedDates.forEach(dateStr => {
        const entry = workoutData[dateStr];
        if (!entry || !entry.details) return;

        Object.keys(entry.details).forEach(typeId => {
          const list = entry.details[typeId] || [];
          list.forEach(ex => {
            if (!ex.name) return;
            if (!exerciseMap.has(ex.name)) {
              exerciseMap.set(ex.name, { name: ex.name, typeId, history: [] });
            }
            const metrics = extractExerciseMetrics(ex);
            if (metrics.weight > 0 || metrics.reps > 0) {
              exerciseMap.get(ex.name).history.push({
                dateStr,
                weight: metrics.weight,
                reps: metrics.reps,
                maxWeight: metrics.weight,
                totalVolume: metrics.totalVolume
              });
            }
          });
        });
      });

      return Array.from(exerciseMap.values()).filter(item => item.history.length > 0);
    }

    /* ============================================================
       渲染視圖邏輯
       ============================================================ */

    function renderAll() {
      renderHeader();
      renderHomeViews();
      if (currentMainPage === 'analytics') {
        renderAnalyticsPage();
      }
    }

    function renderHomeViews() {
      renderWeeklySection();
      renderActionSection();
      renderMonthCalendar();
    }

    function renderAnalyticsPage() {
      renderOverviewStats();
      renderHistoryAndProgressSection();
    }

    function renderHeader() {
      const monthNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      const dayNamesEn = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      document.getElementById('header-date-label').textContent =
        `${monthNames[todayDate.getMonth()]} ${todayDate.getDate()} · ${dayNamesEn[todayDate.getDay()]}`;
    }

    function renderWeeklySection() {
      const baseDate = parseDateKey(selectedDateStr);
      const weekDates = getWeekDates(baseDate);

      const first = weekDates[0];
      const last = weekDates[6];
      document.getElementById('week-range-text').textContent =
        `${first.getMonth() + 1}/${first.getDate()} – ${last.getMonth() + 1}/${last.getDate()}`;

      // 切換「回到今天」按鈕時，維持外層容器與「本週目標」膠囊尺寸完全鎖定不變形
      const jumpBtn = document.getElementById('btn-jump-today');

        jumpBtn.classList.remove('hidden');
      } else {
        jumpBtn.classList.add('hidden');
      }

      const grid = document.getElementById('weekly-grid');
      grid.innerHTML = '';

      let activeDaysCount = 0;

      weekDates.forEach((d, index) => {
        const dStr = formatDateKey(d);
        const record = workoutData[dStr];
        const hasWorkout = record && record.types && record.types.length > 0;
        if (hasWorkout) activeDaysCount++;

        const isSelected = dStr === selectedDateStr;
        const isToday = dStr === todayStr;

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.onclick = () => selectDate(dStr);

        let containerClasses = 'btn-press flex flex-col items-center justify-between py-2.5 px-1 rounded-2xl border transition-all ';
        if (isSelected) {
          containerClasses += 'bg-greige-800 border-greige-800 text-greige-50 shadow-sm';
        } else if (hasWorkout) {
          containerClasses += 'bg-greige-100 border-greige-300/90 text-greige-800 hover:border-greige-400';
        } else {
          containerClasses += 'bg-transparent border-transparent hover:bg-greige-100/80 text-greige-600';
        }

        let dotsHtml = '';
        if (hasWorkout) {
          dotsHtml = `<div class="flex items-center justify-center gap-1 mt-1.5 h-2">`;
          record.types.forEach(t => {
            const color = WORKOUT_TYPES[t]?.dotColor || '#8E7F71';
            dotsHtml += `<span class="w-1.5 h-1.5 rounded-full" style="background-color: ${color}"></span>`;
          });
          dotsHtml += `</div>`;
        } else {
          dotsHtml = `<div class="flex items-center justify-center mt-1.5 h-2"><span class="w-1 h-1 rounded-full ${isSelected ? 'bg-greige-600' : 'bg-greige-300/70'}"></span></div>`;
        }

        const labelText = hasWorkout
          ? record.types.map(t => WORKOUT_TYPES[t].label).join('+')
          : (isToday ? '今天' : '');

        cell.className = containerClasses;
        cell.innerHTML = `
          <span class="text-[11px] font-medium ${isSelected ? 'text-greige-300' : 'text-greige-400'}">${WEEK_DAYS_SHORT[index]}</span>
          <span class="text-sm sm:text-base font-bold mt-1 tabular-nums ${isToday && !isSelected ? 'underline decoration-greige-400 underline-offset-4' : ''}">${d.getDate()}</span>
          ${dotsHtml}
          <span class="text-[10px] mt-1 font-medium truncate max-w-full ${isSelected ? 'text-greige-200' : 'text-greige-500'} h-3.5 leading-3.5">${labelText}</span>
        `;

        grid.appendChild(cell);
      });

      document.getElementById('weekly-count').textContent = activeDaysCount;
      const barsContainer = document.getElementById('weekly-progress-bars');
      const bars = barsContainer.children;
      for (let i = 0; i < 4; i++) {
        if (i < activeDaysCount) {
          bars[i].className = 'w-1.5 h-3.5 rounded-full bg-greige-700 shrink-0 transition-colors duration-300';
        } else {
          bars[i].className = 'w-1.5 h-3.5 rounded-full bg-greige-200 shrink-0 transition-colors duration-300';
        }
      }
    }

    function renderActionSection() {
      const record = workoutData[selectedDateStr] || { types: [], details: {}, note: '' };
      const selectedTypes = record.types || [];
      const details = record.details || {};
      const selDate = parseDateKey(selectedDateStr);

      const badge = document.getElementById('selected-day-badge');
      const title = document.getElementById('selected-date-title');

      if (selectedDateStr === todayStr) {
        badge.textContent = '今天 · TODAY';
        badge.className = 'inline-block text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-greige-800 text-greige-50 mb-1';

          ? `已完成「${selectedTypes.map(t => WORKOUT_TYPES[t].label).join(' + ')}」`

        badge.className = 'inline-block text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-greige-200 text-greige-700 mb-1';
        title.textContent = selectedTypes.length > 0
          ? `當日紀錄「${selectedTypes.map(t => WORKOUT_TYPES[t].label).join(' + ')}」`
          : '補登或檢視訓練紀錄';
      }

      const clearBtn = document.getElementById('btn-clear-day');
      if (selectedTypes.length > 0 || (record.note && record.note.trim() !== '')) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      TYPE_ORDER.forEach(typeId => {
        const btn = document.getElementById(`btn-type-${typeId}`);
        const statusPill = btn.querySelector('.status-pill');
        const subtext = btn.querySelector('.type-subtext');
        const meta = WORKOUT_TYPES[typeId];
        const isActive = selectedTypes.includes(typeId);
        const typeExercises = details[typeId] || [];

        if (isActive) {
          btn.className = `workout-btn btn-press group relative flex flex-col items-start justify-between p-4 sm:p-5 rounded-2xl border-2 ${meta.borderActive} bg-greige-50 shadow-card text-left`;
          statusPill.textContent = typeExercises.length > 0 ? `✓ ${typeExercises.length} 個動作` : '✓ 已完成';
          statusPill.className = `status-pill text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${meta.badgeBg} ${meta.badgeText} transition-colors`;
          subtext.textContent = typeExercises.length > 0
            ? typeExercises.map(e => e.name).join('、')
            : meta.desc;
        } else {
          btn.className = 'workout-btn btn-press group relative flex flex-col items-start justify-between p-4 sm:p-5 rounded-2xl border border-greige-200 bg-greige-100/70 hover:bg-greige-100 hover:border-greige-300 text-left';
          statusPill.textContent = '點此紀錄';
          statusPill.className = 'status-pill text-[11px] font-medium px-2 py-0.5 rounded-full bg-greige-200/80 text-greige-600 transition-colors';
          subtext.textContent = meta.desc;
        }
      });

      const summaryWrap = document.getElementById('day-exercises-summary');
      const chipsContainer = document.getElementById('day-exercises-chips');
      chipsContainer.innerHTML = '';

      let allExercisesForDay = [];
      selectedTypes.forEach(typeId => {
        const exList = details[typeId] || [];
        exList.forEach(ex => {
          allExercisesForDay.push({ typeId, ...ex });
        });
      });

      if (allExercisesForDay.length > 0) {
        summaryWrap.classList.remove('hidden');
        allExercisesForDay.forEach(ex => {
          const meta = WORKOUT_TYPES[ex.typeId];
          const metrics = extractExerciseMetrics(ex);
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.onclick = () => openWorkoutDrawer(ex.typeId);
          chip.className = 'btn-press inline-flex items-center gap-1.5 text-xs bg-greige-100 hover:bg-greige-200/70 border border-greige-200 px-2.5 py-1 rounded-xl text-greige-700 transition-colors';
          chip.innerHTML = `
            <span class="w-1.5 h-1.5 rounded-full" style="background-color:${meta.dotColor}"></span>
            <span class="font-medium">${escapeHtml(ex.name)}</span>
            <span class="text-[11px] text-greige-500 tabular-nums">${metrics.weight > 0 ? metrics.weight + 'kg × ' : ''}${metrics.reps}下</span>
          `;
          chipsContainer.appendChild(chip);
        });
      } else {
        summaryWrap.classList.add('hidden');
      }

      document.getElementById('workout-note-input').value = record.note || '';
    }

    function renderMonthCalendar() {
      document.getElementById('calendar-month-title').textContent = `${calendarYear}年 ${calendarMonth + 1}月`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDayOfMonth = new Date(calendarYear, calendarMonth, 1);
      const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

      let startOffset = firstDayOfMonth.getDay() - 1;
      if (startOffset < 0) startOffset = 6;

      for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement('div');
        empty.className = 'h-11 sm:h-12';
        grid.appendChild(empty);
      }

      let monthWorkoutDays = 0;
      const typeCounts = { push: 0, pull: 0, legs: 0, core: 0 };

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(calendarYear, calendarMonth, day);
        const dStr = formatDateKey(d);
        const record = workoutData[dStr];
        const hasWorkout = record && record.types && record.types.length > 0;

        if (hasWorkout) {
          monthWorkoutDays++;
          record.types.forEach(t => {
            if (typeCounts[t] !== undefined) typeCounts[t]++;
          });
        }

        const isSelected = dStr === selectedDateStr;
        const isToday = dStr === todayStr;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => selectDate(dStr);

        let cls = 'btn-press h-11 sm:h-12 rounded-xl flex flex-col items-center justify-center border transition-all ';
        if (isSelected) {
          cls += 'bg-greige-800 border-greige-800 text-greige-50 shadow-xs';
        } else if (hasWorkout) {
          cls += 'bg-greige-100 border-greige-300/80 text-greige-800 hover:border-greige-500';
        } else {
          cls += 'bg-transparent border-transparent hover:bg-greige-100/80 text-greige-600';
        }

        let dotsHtml = '<div class="flex items-center justify-center gap-0.5 mt-1 h-1.5">';
        if (hasWorkout) {
          record.types.forEach(t => {
            const c = WORKOUT_TYPES[t]?.dotColor || '#8E7F71';
            dotsHtml += `<span class="w-1.5 h-1.5 rounded-full" style="background-color: ${c}"></span>`;
          });
        }
        dotsHtml += '</div>';

        btn.className = cls;
        btn.innerHTML = `
          <span class="text-xs sm:text-sm font-medium tabular-nums ${isToday && !isSelected ? 'font-bold underline decoration-greige-500 underline-offset-2' : ''}">${day}</span>
          ${dotsHtml}
        `;

        grid.appendChild(btn);
      }

      document.getElementById('month-summary-badge').textContent = `累積 ${monthWorkoutDays} 天`;
      const totalSessions = Object.values(typeCounts).reduce((a, b) => a + b, 0);
      document.getElementById('month-total-sessions').textContent = `共 ${totalSessions} 次訓練`;

      document.getElementById('stat-push').textContent = typeCounts.push;
      document.getElementById('stat-pull').textContent = typeCounts.pull;
      document.getElementById('stat-legs').textContent = typeCounts.legs;
      document.getElementById('stat-core').textContent = typeCounts.core;
    }

    function renderOverviewStats() {
      const allDates = Object.keys(workoutData).filter(k => workoutData[k]?.types?.length > 0);
      const currentMonthPrefix = `${todayDate.getFullYear()}-${String(todayDate.getMonth() + 1).padStart(2, '0')}`;
      const monthDates = allDates.filter(d => d.startsWith(currentMonthPrefix));

      let totalVolume = 0;
      allDates.forEach(dStr => {

        Object.values(details).forEach(exList => {
          (exList || []).forEach(ex => {
            totalVolume += extractExerciseMetrics(ex).totalVolume;
          });
        });
      });

      document.getElementById('overview-total-days').textContent = allDates.length;
      document.getElementById('overview-month-days').textContent = monthDates.length;

          const entry = workoutData[dateStr];
          if (!entry || !entry.types || entry.types.length === 0) return false;
          if (historyFilter === 'all') return true;
          return entry.types.includes(historyFilter);
        })
        .sort((a, b) => b.localeCompare(a));

      if (sortedDates.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl bg-greige-100/70 border border-greige-200/80 p-8 text-center">
            <p class="text-sm font-medium text-greige-600">尚無符合條件的訓練歷史</p>

          </div>

            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs sm:text-sm font-bold text-greige-800 tabular-nums">

              </span>

            <div class="flex items-center gap-2 shrink-0">

        setTimeout(() => {

        selectEl.innerHTML = `<option value="">尚無動作重量資料</option>`;
        contentArea.innerHTML = `
          <div class="rounded-2xl bg-greige-100/70 border border-greige-200/80 p-8 text-center">
            <p class="text-sm font-medium text-greige-600">尚無可分析的重量紀錄</p>
            <p class="text-xs text-greige-400 mt-1">在「今日紀錄」中記錄動作與重量後，這裡將自動繪製你的力量進步曲線</p>

      const history = selectedItem.history;
      const dotColor = WORKOUT_TYPES[selectedItem.typeId]?.dotColor || '#8E7F71';

      const prWeight = Math.max(...history.map(h => h.maxWeight));
      const latestRecord = history[history.length - 1];
      const prevRecord = history.length >= 2 ? history[history.length - 2] : null;
      const firstRecord = history[0];

      let diffBadgeHtml = '';
      if (prevRecord) {

      const rowsHtml = reverseHistory.map((h, idx) => {
        const dObj = parseDateKey(h.dateStr);

            <div>

                <span class="text-xs font-semibold text-greige-800 tabular-nums">${dateLabel}</span>
                ${isPr ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-greige-800 text-greige-50">PR</span>` : ''}
                ${idx === 0 ? `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-greige-200 text-greige-700">最新</span>` : ''}
              </div>

            </div>
            <div class="text-right shrink-0">
              <span class="text-sm font-bold text-greige-800 tabular-nums">${h.maxWeight} kg</span>
              <p class="text-[11px] text-greige-400 tabular-nums">容量 ${h.totalVolume.toLocaleString()} kg</p>

      }).join('');

      contentArea.innerHTML = `
        <div class="grid grid-cols-3 gap-2.5 mb-4">
          <div class="bg-greige-100 rounded-2xl p-3 border border-greige-200/80">

              ${diffBadgeHtml}
            </div>
          </div>
          <div class="bg-greige-100 rounded-2xl p-3 border border-greige-200/80">
            <span class="text-[11px] text-greige-500 block">累計成長幅度</span>
            <span class="text-base sm:text-lg font-bold text-greige-800 tabular-nums mt-0.5 block">${growthText}</span>
          </div>
        </div>

        ${chartHtml}

        <div class="mt-4">

            ${rowsHtml}
          </div>
        </div>
      `;
    }

    function buildProgressSvgChart(history, strokeColor) {
      const recent = history.slice(-8);
      const width = 460;
      const height = 160;
      const padLeft = 36;
      const padRight = 24;
      const padTop = 24;
      const padBottom = 28;

      const weights = recent.map(h => h.maxWeight);
      let minW = Math.min(...weights);
      let maxW = Math.max(...weights);
      if (minW === maxW) {
        minW = Math.max(0, minW - 5);
        maxW = maxW + 5;
      } else {
        const margin = (maxW - minW) * 0.2;
        minW = Math.max(0, minW - margin);
        maxW = maxW + margin;
      }

      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const points = recent.map((h, i) => {
        const x = padLeft + (recent.length === 1 ? plotW / 2 : (i / (recent.length - 1)) * plotW);
        const y = padTop + plotH - ((h.maxWeight - minW) / (maxW - minW)) * plotH;
        const dObj = parseDateKey(h.dateStr);
        const label = `${dObj.getMonth() + 1}/${dObj.getDate()}`;
        return { x, y, weight: h.maxWeight, label };
      });

      const polylinePoints = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const areaPoints = `${points[0].x.toFixed(1)},${(padTop + plotH).toFixed(1)} ${polylinePoints} ${points[points.length - 1].x.toFixed(1)},${(padTop + plotH).toFixed(1)}`;

      const circlesAndLabels = points.map(p => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#FAF9F7" stroke="${strokeColor}" stroke-width="2.5" />
        <text x="${p.x.toFixed(1)}" y="${(p.y - 9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#423B33">${p.weight}kg</text>
        <text x="${p.x.toFixed(1)}" y="${(height - 8).toFixed(1)}" text-anchor="middle" font-size="10" fill="#8E7F71">${p.label}</text>
      `).join('');

      return `
        <div class="bg-greige-100/80 rounded-2xl p-3.5 border border-greige-200/80">
          <div class="flex items-center justify-between mb-1 px-1">
            <span class="text-[11px] font-medium text-greige-500">最大單組重量趨勢 (kg)</span>
            <span class="text-[11px] text-greige-400">近 ${recent.length} 次</span>
          </div>
          <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto overflow-visible">
            <defs>
              <linearGradient id="greigeChartGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.24" />
                <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0" />
              </linearGradient>
            </defs>
            <line x1="${padLeft}" y1="${padTop}" x2="${width - padRight}" y2="${padTop}" stroke="#DDD4C8" stroke-dasharray="3 3" stroke-width="1" />
            <line x1="${padLeft}" y1="${padTop + plotH / 2}" x2="${width - padRight}" y2="${padTop + plotH / 2}" stroke="#DDD4C8" stroke-dasharray="3 3" stroke-width="1" />
            <line x1="${padLeft}" y1="${padTop + plotH}" x2="${width - padRight}" y2="${padTop + plotH}" stroke="#DDD4C8" stroke-width="1" />

            <polygon points="${areaPoints}" fill="url(#greigeChartGrad)" />
            <polyline fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polylinePoints}" />
            ${circlesAndLabels}
          </svg>
        </div>
      `;
    }

    /**
     * 載入內建示範訓練紀錄（精簡格式：僅重量與次數）
     */
    function loadSampleData(notify = true) {
      const addDays = (base, offset) => {
        const d = new Date(base);
        d.setDate(d.getDate() + offset);
        return formatDateKey(d);
      };

      const samples = {};

      samples[addDays(todayDate, -21)] = {
        types: ['push'],
        details: {
          push: [
            { name: '槓鈴臥推', weight: 60, reps: 8 },
            { name: '啞鈴肩推', weight: 16, reps: 10 }
          ]
        },
        note: '暖身充分，胸肌發力感受度很好'
      };

      samples[addDays(todayDate, -18)] = {
        types: ['pull'],
        details: {
          pull: [
            { name: '滑輪下拉', weight: 50, reps: 10 },
            { name: '槓鈴划船', weight: 45, reps: 10 }
          ]
        },
        note: ''
      };

      samples[addDays(todayDate, -14)] = {
        types: ['push'],
        details: {
          push: [
            { name: '槓鈴臥推', weight: 62.5, reps: 8 },
            { name: '啞鈴肩推', weight: 18, reps: 9 }
          ]
        },
        note: '臥推順利突破 62.5kg'
      };

      samples[addDays(todayDate, -10)] = {
        types: ['legs', 'core'],
        details: {
          legs: [
            { name: '槓鈴深蹲', weight: 80, reps: 8 }
          ],
          core: [
            { name: '懸垂舉腿', weight: 0, reps: 15 }
          ]
        },
        note: '深蹲核心穩定度提升'
      };

      samples[addDays(todayDate, -5)] = {
        types: ['pull'],
        details: {
          pull: [
            { name: '滑輪下拉', weight: 55, reps: 10 },
            { name: '啞鈴二頭彎舉', weight: 12, reps: 10 }
          ]
        },
        note: ''
      };

      samples[addDays(todayDate, -2)] = {
        types: ['push'],
        details: {
          push: [
            { name: '槓鈴臥推', weight: 65, reps: 8 },
            { name: '啞鈴肩推', weight: 18, reps: 10 }
          ]
        },
        note: '臥推新紀錄 65kg！'
      };

      workoutData = { ...samples, ...workoutData };
      saveToStorage();
      renderAll();
      if (notify) {
        showToast('已載入示範訓練與進步數據', '#8E7F71');
      }
    }

    // 啟動應用
    window.addEventListener('DOMContentLoaded', init);
    // 支援按下 ESC 鍵快速關閉訓練明細抽屜
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeDrawerType) {
        closeWorkoutDrawer();
      }
    });
  </script>
</body>
